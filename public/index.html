<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울 도시 홍수 리스크 대시보드</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">

// ── AI 패널 상태 ──────────────────────────────────────────
let currentDistrict = null;
let chatHistory = [];
let currentRainLabel = '30mm/hr';

function openAI(){
  document.getElementById('ai-panel').classList.add('open');
  document.getElementById('ai-fab').style.display='none';
}
function closeAI(){
  document.getElementById('ai-panel').classList.remove('open');
  document.getElementById('ai-fab').style.display='flex';
}

function setDistrict(name, prob, rain){
  currentDistrict = {name, prob, rain};
  currentRainLabel = rain + 'mm/hr';
  chatHistory = [];
  document.getElementById('ai-district').innerHTML =
    `<b>${name}</b> · 강수량 ${rain}mm/hr · 침수 확률 <b>${(prob*100).toFixed(1)}%</b>`;
  document.getElementById('chat-area').innerHTML='';
  openAI();

  const level = prob>=0.75?'고위험':prob>=0.55?'중위험':prob>=0.30?'저위험':'안전';
  const quicks = [
    `${name} 침수 원인 분석해줘`,
    `${level} 등급 대응방안 알려줘`,
    `인프라 투자 우선순위는?`,
    `기후변화 대응 전략은?`,
  ];
  document.getElementById('quick-btns').innerHTML =
    quicks.map(q=>`<button class="quick-btn" onclick="sendQuick('${q}')">${q}</button>`).join('');

  autoAnalyze(name, prob, rain);
}

function autoAnalyze(name, prob, rain){
  const level = prob>=0.75?'고위험':prob>=0.55?'중위험':prob>=0.30?'저위험':'안전';
  const prompt = `서울 ${name}의 도시 홍수 리스크를 분석해줘.
강수량: ${rain}mm/hr, 침수 확률: ${(prob*100).toFixed(1)}%, 리스크 등급: ${level}.
다음 형식으로 간결하게 답해줘:
1. 리스크 요인 (2~3가지)
2. 즉각 대응방안 (2~3가지)
3. 장기 인프라 개선 방향 (1~2가지)
각 항목은 짧게, 실무적으로 써줘.`;
  callClaude(prompt, true);
}

function sendQuick(q){
  document.getElementById('chat-input').value = q;
  sendMsg();
}

function sendMsg(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text || !currentDistrict) return;
  input.value='';
  appendMsg(text,'user');

  const sysCtx = currentDistrict
    ? `너는 도시 홍수 리스크 분석 전문가야. 현재 분석 대상: 서울 ${currentDistrict.name}, 강수량 ${currentDistrict.rain}mm/hr, 침수 확률 ${(currentDistrict.prob*100).toFixed(1)}%. 한국어로 간결하고 실무적으로 답해줘.`
    : '너는 도시 홍수 리스크 분석 전문가야. 한국어로 답해줘.';

  callClaude(text, false, sysCtx);
}

function appendMsg(text, role){
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg msg-' + (role==='user'?'user':'ai');
  div.textContent = text;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

async function callClaude(userMsg, isAuto=false, sysOverride=null){
  const btn = document.getElementById('send-btn');
  btn.disabled = true;

  if(!isAuto) chatHistory.push({role:'user', content: userMsg});

  const loadDiv = appendMsg('분석 중…', 'ai');
  loadDiv.classList.add('loading');

  const sys = sysOverride || (currentDistrict
    ? `너는 도시 홍수 리스크 분석 전문가야. 서울 ${currentDistrict.name} 분석 중. 강수량 ${currentDistrict.rain}mm/hr, 침수 확률 ${(currentDistrict.prob*100).toFixed(1)}%. 한국어로 간결하게 답해줘.`
    : '너는 도시 홍수 리스크 분석 전문가야. 한국어로 답해줘.');

  const messages = isAuto
    ? [{role:'user', content: userMsg}]
    : chatHistory;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ system: sys, messages })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    const reply = data.reply || '응답을 받지 못했어요.';
    loadDiv.classList.remove('loading');
    loadDiv.textContent = reply;
    if(!isAuto) chatHistory.push({role:'assistant', content: reply});
  } catch(e) {
    loadDiv.classList.remove('loading');
    loadDiv.textContent = '오류: ' + e.message;
  }
  document.getElementById('chat-area').scrollTop = 9999;
  btn.disabled = false;
}

// ── 지도 클릭 시 AI 패널 연동 ────────────────────────────
const _origRenderLayers = renderLayers;
renderLayers = function(rain){
  _origRenderLayers(rain);
  // choroLayer onEachFeature에서 click 이벤트에 setDistrict 추가
  if(choroLayer){
    choroLayer.eachLayer(function(layer){
      const f = layer.feature;
      const prob = f.properties.flood_prob || 0;
      layer.on('click', function(){
        setDistrict(f.properties.name, prob, rain);
      });
    });
  }
};

</script>

  </div>
  <button class="ai-fab" id="ai-fab" onclick="openAI()">✦ AI 분석</button>

<script>
const RAW = MAP_DATA;
const DATA = {};
for(const k in RAW){ DATA[parseInt(k)] = RAW[k]; }

const map = L.map('map',{center:[37.555,127.0],zoom:11});
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19
}).addTo(map);

let heatLayer=null, choroLayer=null;
let showHeat=true, showChoro=true;
let currentRain=30;

function riskBadge(prob){
  if(prob>=0.75) return '<span class="risk-badge badge-high">고위험</span>';
  if(prob>=0.55) return '<span class="risk-badge badge-mid">중위험</span>';
  if(prob>=0.30) return '<span class="risk-badge badge-low">저위험</span>';
  return '<span class="risk-badge badge-safe">안전</span>';
}

function probColor(p){
  if(p>=0.75) return '#C0392B';
  if(p>=0.55) return '#E67E22';
  if(p>=0.30) return '#27AE60';
  return '#95A5A6';
}

function updateStats(rain){
  const d = DATA[rain];
  document.getElementById('stat-high').textContent = d.high;
  document.getElementById('stat-high-pct').textContent = d.high_pct + '%';
  document.getElementById('stat-mid').textContent = d.mid;
  document.getElementById('stat-mid-pct').textContent = d.mid_pct + '%';
  document.getElementById('stat-prob').textContent = d.avg_prob + '%';
  document.getElementById('stat-total').textContent = d.total;

  const top5 = d.top5;
  document.getElementById('top5-list').innerHTML = top5.map(([name,prob])=>
    `<div class="top5-row"><span>${name}</span>${riskBadge(prob)}<span style="color:#888">${(prob*100).toFixed(1)}%</span></div>`
  ).join('');
}

const infoDiv = L.control({position:'topright'});
infoDiv.onAdd = function(){
  this._div = L.DomUtil.create('div','info-panel');
  this._div.innerHTML = '행정구를 클릭하세요';
  return this._div;
};
infoDiv.addTo(map);

function renderLayers(rain){
  const d = DATA[rain];
  if(heatLayer){ map.removeLayer(heatLayer); heatLayer=null; }
  if(choroLayer){ map.removeLayer(choroLayer); choroLayer=null; }

  heatLayer = L.heatLayer(d.heat, {
    radius:22, blur:16, maxZoom:13,
    gradient:{0.3:'#27AE60',0.55:'#E67E22',0.75:'#C0392B',1.0:'#7B0000'}
  });
  if(showHeat) heatLayer.addTo(map);

  choroLayer = L.geoJSON(d.geojson, {
    style: function(f){
      const p = f.properties.flood_prob||0;
      return {fillColor:probColor(p), weight:1.5, color:'#fff',
              fillOpacity:0.55, opacity:0.8};
    },
    onEachFeature: function(f,layer){
      const p = f.properties.flood_prob||0;
      layer.on({
        mouseover: function(e){
          e.target.setStyle({weight:2.5,color:'#333',fillOpacity:0.75});
          infoDiv._div.innerHTML =
            `<b>${f.properties.name}</b><br>침수 확률: <b>${(p*100).toFixed(1)}%</b><br>${riskBadge(p)}`;
        },
        mouseout: function(e){ choroLayer.resetStyle(e.target); },
        click: function(e){ map.fitBounds(e.target.getBounds(),{padding:[30,30]}); }
      });
    }
  });
  if(showChoro) choroLayer.addTo(map);
}

// 범례
const legend = L.control({position:'bottomright'});
legend.onAdd = function(){
  const d = L.DomUtil.create('div','legend');
  d.innerHTML = `<b style="font-size:12px">침수 확률</b>
    <div class="leg-item"><div class="leg-dot" style="background:#C0392B"></div>고위험 (≥75%)</div>
    <div class="leg-item"><div class="leg-dot" style="background:#E67E22"></div>중위험 (55–75%)</div>
    <div class="leg-item"><div class="leg-dot" style="background:#27AE60"></div>저위험 (30–55%)</div>
    <div class="leg-item"><div class="leg-dot" style="background:#95A5A6"></div>안전 (&lt;30%)</div>`;
  return d;
};
legend.addTo(map);

function rainTag(r){
  if(r<=40) return ['tag-normal','일반 강우','🌦'];
  if(r<=70) return ['tag-heavy','강한 강우','🌧'];
  return ['tag-extreme','극한 강우','⛈'];
}

function selectScenario(rain){
  currentRain = rain;
  updateStats(rain);
  renderLayers(rain);
}

let sliderTimer = null;
function onSlider(val){
  const [cls, label, icon] = rainTag(val);
  document.getElementById('rain-num').textContent = val;
  const tag = document.getElementById('rain-tag');
  tag.className = 'rain-tag ' + cls;
  tag.textContent = label;
  // 슬라이더 움직이는 동안은 debounce (300ms 후 렌더)
  clearTimeout(sliderTimer);
  sliderTimer = setTimeout(()=>selectScenario(val), 300);
}

function toggleLayer(type){
  if(type==='heat'){
    showHeat = !showHeat;
    document.getElementById('lb-heat').classList.toggle('on', showHeat);
    if(showHeat && heatLayer) heatLayer.addTo(map);
    else if(heatLayer) map.removeLayer(heatLayer);
  } else {
    showChoro = !showChoro;
    document.getElementById('lb-choro').classList.toggle('on', showChoro);
    if(showChoro && choroLayer) choroLayer.addTo(map);
    else if(choroLayer) map.removeLayer(choroLayer);
  }
}

onSlider(30); selectScenario(30);


// ── AI 패널 상태 ──────────────────────────────────────────
let currentDistrict = null;
let chatHistory = [];
let currentRainLabel = '30mm/hr';

function openAI(){
  document.getElementById('ai-panel').classList.add('open');
  document.getElementById('ai-fab').style.display='none';
}
function closeAI(){
  document.getElementById('ai-panel').classList.remove('open');
  document.getElementById('ai-fab').style.display='flex';
}

function setDistrict(name, prob, rain){
  currentDistrict = {name, prob, rain};
  currentRainLabel = rain + 'mm/hr';
  chatHistory = [];
  document.getElementById('ai-district').innerHTML =
    `<b>${name}</b> · 강수량 ${rain}mm/hr · 침수 확률 <b>${(prob*100).toFixed(1)}%</b>`;
  document.getElementById('chat-area').innerHTML='';
  openAI();

  const level = prob>=0.75?'고위험':prob>=0.55?'중위험':prob>=0.30?'저위험':'안전';
  const quicks = [
    `${name} 침수 원인 분석해줘`,
    `${level} 등급 대응방안 알려줘`,
    `인프라 투자 우선순위는?`,
    `기후변화 대응 전략은?`,
  ];
  document.getElementById('quick-btns').innerHTML =
    quicks.map(q=>`<button class="quick-btn" onclick="sendQuick('${q}')">${q}</button>`).join('');

  autoAnalyze(name, prob, rain);
}

function autoAnalyze(name, prob, rain){
  const level = prob>=0.75?'고위험':prob>=0.55?'중위험':prob>=0.30?'저위험':'안전';
  const prompt = `서울 ${name}의 도시 홍수 리스크를 분석해줘.
강수량: ${rain}mm/hr, 침수 확률: ${(prob*100).toFixed(1)}%, 리스크 등급: ${level}.
다음 형식으로 간결하게 답해줘:
1. 리스크 요인 (2~3가지)
2. 즉각 대응방안 (2~3가지)
3. 장기 인프라 개선 방향 (1~2가지)
각 항목은 짧게, 실무적으로 써줘.`;
  callClaude(prompt, true);
}

function sendQuick(q){
  document.getElementById('chat-input').value = q;
  sendMsg();
}

function sendMsg(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text || !currentDistrict) return;
  input.value='';
  appendMsg(text,'user');

  const sysCtx = currentDistrict
    ? `너는 도시 홍수 리스크 분석 전문가야. 현재 분석 대상: 서울 ${currentDistrict.name}, 강수량 ${currentDistrict.rain}mm/hr, 침수 확률 ${(currentDistrict.prob*100).toFixed(1)}%. 한국어로 간결하고 실무적으로 답해줘.`
    : '너는 도시 홍수 리스크 분석 전문가야. 한국어로 답해줘.';

  callClaude(text, false, sysCtx);
}

function appendMsg(text, role){
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg msg-' + (role==='user'?'user':'ai');
  div.textContent = text;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

async function callClaude(userMsg, isAuto=false, sysOverride=null){
  const btn = document.getElementById('send-btn');
  btn.disabled = true;

  if(!isAuto) chatHistory.push({role:'user', content: userMsg});

  const loadDiv = appendMsg('분석 중…', 'ai');
  loadDiv.classList.add('loading');

  const sys = sysOverride || (currentDistrict
    ? `너는 도시 홍수 리스크 분석 전문가야. 서울 ${currentDistrict.name} 분석 중. 강수량 ${currentDistrict.rain}mm/hr, 침수 확률 ${(currentDistrict.prob*100).toFixed(1)}%. 한국어로 간결하게 답해줘.`
    : '너는 도시 홍수 리스크 분석 전문가야. 한국어로 답해줘.');

  const messages = isAuto
    ? [{role:'user', content: userMsg}]
    : chatHistory;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ system: sys, messages })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    const reply = data.reply || '응답을 받지 못했어요.';
    loadDiv.classList.remove('loading');
    loadDiv.textContent = reply;
    if(!isAuto) chatHistory.push({role:'assistant', content: reply});
  } catch(e) {
    loadDiv.classList.remove('loading');
    loadDiv.textContent = '오류: ' + e.message;
  }
  document.getElementById('chat-area').scrollTop = 9999;
  btn.disabled = false;
}

// ── 지도 클릭 시 AI 패널 연동 ────────────────────────────
const _origRenderLayers = renderLayers;
renderLayers = function(rain){
  _origRenderLayers(rain);
  // choroLayer onEachFeature에서 click 이벤트에 setDistrict 추가
  if(choroLayer){
    choroLayer.eachLayer(function(layer){
      const f = layer.feature;
      const prob = f.properties.flood_prob || 0;
      layer.on('click', function(){
        setDistrict(f.properties.name, prob, rain);
      });
    });
  }
};
